<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#221D36" />
<title>沙盘 · 摆一个世界</title>
<meta name="description" content="一盘沙，一些微缩模型。不用说话，摆出来就好。" />
<style>
  :root{
    --ink:#221D36; --ink2:#2A2440; --ink3:#332C4E; --line:#3B3358;
    --paper:#F1ECE1; --muted:#9C94B4; --faint:#6E6786;
    --lamp:#F0B36A; --lilac:#A78BFA;

    /* 沙具配色。前缀 fig- 是必须的：不加就会把上面 UI 的 --line 覆盖成纸白。 */
    --fig-body:#57506F; --fig-body2:#7A6E96; --fig-line:#F1ECE1;
    --fig-ac:#F0B36A; --fig-ac2:#A78BFA;

    /* 木框 */
    --wood1:#4C3D2E; --wood2:#33291E; --wood3:#241C14;

    --c-happy:#F2C94C; --c-calm:#7FB8E6; --c-anxious:#E88C5A;
    --c-tired:#8E8AA6; --c-sad:#6E8FD9; --c-angry:#E07A6B;

    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    --r-lg:22px; --r-md:16px; --r-sm:11px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--sans); background:var(--ink); color:var(--paper);
    line-height:1.7; min-height:100vh; -webkit-font-smoothing:antialiased;
    overflow-x:hidden; overscroll-behavior:none;
  }

  .sky{position:fixed;inset:0;z-index:-2;
    background:radial-gradient(120% 80% at 50% -10%, #34294f 0%, var(--ink) 55%)}
  .blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);opacity:.28;pointer-events:none}
  .blob.a{width:56vw;height:56vw;left:-18vw;top:-8vw;background:var(--lamp)}
  .blob.b{width:50vw;height:50vw;right:-16vw;top:6vh;background:var(--lilac)}

  .shell{max-width:1080px;margin:0 auto;padding:0 18px 70px}

  /* ---------- 顶栏 ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:20px 0 14px;border-bottom:1px solid var(--line)}
  .back{color:var(--muted);text-decoration:none;font-size:.82rem;white-space:nowrap;
    padding:6px 12px;border:1px solid var(--line);border-radius:99px;transition:.15s}
  .back:hover{color:var(--lamp);border-color:var(--lamp)}
  .brand{font-family:var(--serif);font-weight:700;font-size:1.2rem;letter-spacing:1px;line-height:1.2}
  .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.68rem;
    color:var(--faint);letter-spacing:1.5px}
  .top-act{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{border:1px solid var(--line);background:transparent;color:var(--paper);
    padding:8px 15px;border-radius:99px;font-size:.82rem;cursor:pointer;
    font-family:var(--sans);transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--lamp);color:var(--lamp)}
  .btn.primary{background:linear-gradient(120deg,var(--lamp),#e89a4f);color:#2a1a05;
    border-color:transparent;font-weight:600}
  .btn.primary:hover{filter:brightness(1.06);color:#2a1a05}
  .btn .n{color:var(--faint);font-size:.72rem;margin-left:4px}
  .btn:hover .n{color:inherit}
  .btn:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

  /* ---------- 舞台 ---------- */
  .stage{display:grid;grid-template-columns:1fr;gap:20px;margin-top:20px}
  @media(min-width:900px){ .stage{grid-template-columns:1fr 288px;gap:24px;align-items:start} }

  /* ---------- 沙盘 ---------- */
  .tray-wrap{position:relative}
  .tray{
    position:relative; display:block; width:100%;
    padding:13px 13px 21px;                 /* 下沿更厚 = 箱子的前沿 */
    border-radius:12px;
    background:linear-gradient(160deg,var(--wood1),var(--wood2) 58%,var(--wood3));
    box-shadow:
      inset 0 1px 0 rgba(255,214,160,.30),
      inset 0 -2px 0 rgba(0,0,0,.45),
      0 0 0 1px #1c1610,
      0 26px 54px -24px rgba(0,0,0,.85);
  }
  .tray-inner{
    position:relative; width:100%; aspect-ratio:4/3;
    border-radius:3px; overflow:hidden; background:#2A2440;
    box-shadow:inset 0 9px 20px -11px rgba(0,0,0,.9),
               inset 0 -3px 10px -6px rgba(0,0,0,.6);
  }
  #sand{position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:crosshair;
    transition:filter .2s}
  .tray-inner.piling #sand{cursor:cell}

  .layer{position:absolute;inset:0;pointer-events:none}

  /* 沙具 */
  /* --figw 由脚本按 Scene.FIG_W 写入。缩略图合成用的是同一个常量，
     写死在这里的话，两边一旦改岔了缩略图里的沙具就会和页面不一致。 */
  .fig{
    position:absolute;
    width:calc(var(--figw,8.5%) * var(--sc,1));
    aspect-ratio:1;
    transform:translate(-50%,-100%);
    transform-origin:50% 100%;
  }
  .fig .art{
    position:absolute;inset:0;
    transform:rotate(var(--rot,0deg));
    transform-origin:50% 100%;
    pointer-events:auto; cursor:grab; touch-action:none;
    transition:filter .15s;
  }
  .fig .art:active{cursor:grabbing}
  .fig .art svg{display:block;width:100%;height:100%;
    filter:drop-shadow(0 1px 2px rgba(16,10,26,.55))}
  .fig.sel .art{filter:drop-shadow(0 0 4px var(--lamp))}
  .fig.dragging{opacity:.88}

  .fig .sh{                                     /* 落地投影 */
    position:absolute; left:50%; bottom:0;
    width:74%; height:20%;
    transform:translate(-50%,42%) scale(var(--shs,1));
    background:radial-gradient(ellipse at 50% 50%,
      rgba(26,18,38,.82) 0%, rgba(26,18,38,.42) 46%, rgba(26,18,38,0) 72%);
    opacity:var(--sho,.4);
    pointer-events:none;
  }

  .fig .tools{
    position:absolute; left:50%; top:100%;
    transform:translate(-50%,10px);
    display:none; gap:3px; padding:3px;
    background:rgba(34,29,54,.94); border:1px solid var(--line);
    border-radius:99px; backdrop-filter:blur(6px);
    pointer-events:auto; z-index:5;
  }
  .fig.sel .tools{display:flex}
  .fig .tools button{
    width:26px;height:26px;border:none;border-radius:50%;
    background:transparent;color:var(--paper);cursor:pointer;
    font-size:.82rem;line-height:1;font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;transition:.12s}
  .fig .tools button:hover{background:var(--ink3);color:var(--lamp)}
  .fig .tools button.del:hover{color:var(--c-angry)}

  .brush{
    position:absolute; border-radius:50%; pointer-events:none;
    border:1.5px solid rgba(241,236,225,.55);
    box-shadow:0 0 0 1px rgba(0,0,0,.3), inset 0 0 12px rgba(0,0,0,.25);
    transform:translate(-50%,-50%); opacity:0; transition:opacity .18s;
    width:var(--bd,60px); height:var(--bd,60px);
  }
  .brush.on{opacity:1}
  .brush.pile{border-color:rgba(240,179,106,.75)}

  .hint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; padding:0 12%;
    transition:opacity .6s, visibility 0s .6s;   /* 淡出之后才真正隐藏 */
  }
  .hint p{
    font-family:var(--serif); font-size:.92rem; letter-spacing:1px;
    color:rgba(241,236,225,.5); text-align:center;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .hint.gone{opacity:0;visibility:hidden}

  /* ---------- 工具条 ---------- */
  .tools-bar{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin-top:14px; padding:10px 12px;
    background:var(--ink2); border:1px solid var(--line); border-radius:var(--r-md);
  }
  .seg{display:flex;background:var(--ink3);border-radius:99px;padding:3px;gap:2px}
  .seg button{
    border:none;background:transparent;color:var(--muted);cursor:pointer;
    padding:6px 14px;border-radius:99px;font-size:.82rem;font-family:var(--sans);
    transition:.15s;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--lamp);color:#2a1a05;font-weight:600}
  .seg button:not([aria-pressed="true"]):hover{color:var(--paper)}
  .seg.sizes button{padding:6px 10px}
  .seg.sizes i{display:block;border-radius:50%;background:currentColor}
  .seg.sizes button[aria-pressed="true"] i{background:#2a1a05}
  .spacer{flex:1 1 auto}
  .tools-bar .tlabel{font-size:.74rem;color:var(--faint);margin-right:2px}

  /* ---------- 沙具架 ---------- */
  .shelf{
    background:var(--ink2); border:1px solid var(--line); border-radius:var(--r-lg);
    overflow:hidden; display:flex; flex-direction:column;
  }
  @media(min-width:900px){ .shelf{max-height:calc(100vh - 150px); position:sticky; top:20px} }
  .shelf-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .shelf-head h2{font-family:var(--serif);font-size:.98rem;font-weight:700;letter-spacing:1px}
  .shelf-head p{font-size:.72rem;color:var(--faint);margin-top:2px}
  .cats{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:5px 12px;border-radius:99px;font-size:.76rem;cursor:pointer;
    white-space:nowrap;font-family:var(--sans);transition:.15s}
  .cats button[aria-pressed="true"]{background:var(--lilac);color:#1c1530;border-color:var(--lilac);font-weight:600}
  /* minmax(0,1fr) 而不是 1fr：1fr 隐含 minmax(auto,1fr)，
     svg 的 min-content 会把列撑开，第四个沙具就被挤出侧栏了。 */
  .items{
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px;
    padding:4px 12px 16px; overflow-y:auto; flex:1; min-height:120px;
  }
  @media(max-width:899px){ .items{grid-template-columns:repeat(5,minmax(0,1fr));max-height:220px} }
  .chip{
    position:relative; aspect-ratio:1; border-radius:var(--r-sm);
    border:1px solid transparent; background:var(--ink3);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:6px 4px 5px;
    cursor:grab; touch-action:none; transition:transform .14s,border-color .15s,background .15s;
  }
  .chip:hover{transform:translateY(-2px);border-color:var(--line);background:#3B3358}
  .chip:active{cursor:grabbing}
  .chip svg{flex:1 1 auto;min-height:0;width:100%;display:block;pointer-events:none}

  /* 沙具的取色。shelf.js 里的 svg 只画几何、只挂类名，配色全在这里，
     所以「一套沙具」的观感可以整体调，不用改 48 个文件。 */
  .chip svg > *, .fig svg > *{
    fill:var(--fig-body);
    stroke:var(--fig-line); stroke-width:1.7;
    stroke-linejoin:round; stroke-linecap:round;
  }
  .chip svg .a, .fig svg .a{fill:var(--fig-ac)}
  .chip svg .b, .fig svg .b{fill:var(--fig-ac2)}
  .chip svg .l, .fig svg .l{fill:var(--fig-line)}
  .chip svg .n, .fig svg .n{fill:none}
  .chip svg .d, .fig svg .d{fill:var(--fig-body2)}
  /* 名字常驻。触屏没有 hover，只靠图标认路太难找。 */
  .chip .cn{
    font-size:.56rem; line-height:1.15; color:var(--faint);
    max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    pointer-events:none; transition:color .15s;
  }
  .chip:hover .cn{color:var(--muted)}

  #ghost{
    position:fixed; z-index:80; pointer-events:none;
    width:70px;height:70px; transform:translate(-50%,-58%);
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.6));
    opacity:.95; display:none;
  }
  #ghost svg{width:100%;height:100%;display:block}

  /* ---------- 弹层 ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(14,11,24,.76);backdrop-filter:blur(7px);
    display:none;align-items:center;justify-content:center;z-index:60;padding:20px;
    overflow-y:auto;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-lg);
    width:min(460px,100%);padding:26px 24px;position:relative;margin:auto;
  }
  .modal .x{position:absolute;top:14px;right:16px;background:none;border:none;
    color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1}
  .modal .x:hover{color:var(--paper)}
  .modal h3{font-family:var(--serif);font-weight:700;font-size:1.16rem;letter-spacing:1px}
  .modal .sub{color:var(--muted);font-size:.84rem;margin-top:6px;line-height:1.7}
  .modal input[type=text]{
    width:100%;background:var(--ink3);border:1px solid var(--line);border-radius:var(--r-md);
    color:var(--paper);font-family:var(--serif);font-size:1rem;padding:12px 14px;margin-top:10px}
  .modal input[type=text]::placeholder{color:var(--faint)}

  .moodrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .moodrow button{
    border:1px solid var(--line);background:transparent;color:var(--muted);
    padding:6px 13px;border-radius:99px;font-size:.82rem;cursor:pointer;
    font-family:var(--sans);transition:.15s}
  .moodrow button[aria-pressed="true"]{
    background:color-mix(in srgb,var(--mc) 22%,var(--ink3));
    border-color:var(--mc);color:var(--paper);font-weight:500}
  .fieldlabel{font-size:.78rem;color:var(--muted);margin-top:20px;letter-spacing:.3px}
  .fieldlabel b{color:var(--paper);font-weight:500}

  .witness{
    margin-top:20px; padding:16px 18px; border-radius:var(--r-md);
    background:color-mix(in srgb,var(--lamp) 9%,var(--ink3));
    border:1px solid color-mix(in srgb,var(--lamp) 26%,var(--line));
    font-family:var(--serif); font-size:.95rem; line-height:1.8;
  }
  .witness em{display:block;font-style:normal;font-size:.68rem;letter-spacing:2px;
    color:var(--lamp);margin-bottom:6px;font-family:var(--sans)}
  .modal .go{
    width:100%;margin-top:20px;border:none;border-radius:var(--r-md);padding:14px;
    background:linear-gradient(120deg,var(--lamp),#e89a4f);color:#2a1a05;
    font-weight:600;font-size:.98rem;font-family:var(--sans);cursor:pointer;letter-spacing:2px}
  .modal .go:hover{filter:brightness(1.06)}
  /* 不可逆的那一下。不用正红——这是个陪伴工具，不该像系统报错。 */
  .modal .go.warn{background:linear-gradient(120deg,#C87F6C,#B26A58);color:#2a1210}
  .modal .ghost-btn{
    width:100%;margin-top:9px;border:1px solid var(--line);background:transparent;
    color:var(--muted);border-radius:var(--r-md);padding:11px;font-size:.84rem;
    font-family:var(--sans);cursor:pointer;transition:.15s}
  .modal .ghost-btn:hover{color:var(--paper);border-color:var(--faint)}

  /* 我的沙盘 */
  .gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}
  .gcard{
    border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
    background:var(--ink3);cursor:pointer;transition:.15s;position:relative}
  .gcard:hover{border-color:var(--lamp);transform:translateY(-2px)}
  .gcard .th{width:100%;aspect-ratio:4/3;display:block;object-fit:cover;background:#2A2440}
  .gcard .meta{padding:8px 10px}
  .gcard .nm{font-family:var(--serif);font-size:.86rem;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcard .dt{font-size:.68rem;color:var(--faint)}
  .gcard .rm{
    position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
    border:none;background:rgba(20,15,32,.8);color:var(--muted);cursor:pointer;
    font-size:.72rem;line-height:1;opacity:0;transition:.15s}
  .gcard:hover .rm{opacity:1}
  .gcard .rm:hover{color:var(--c-angry)}

  .empty{color:var(--muted);text-align:center;padding:30px 12px;font-size:.88rem;
    border:1px dashed var(--line);border-radius:var(--r-md);margin-top:18px}

  footer{margin-top:44px;text-align:center;color:var(--faint);font-size:.72rem;line-height:1.9}
  footer b{color:var(--muted);font-weight:500}

  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--paper);color:var(--ink);padding:10px 20px;border-radius:99px;
    font-size:.85rem;opacity:0;transition:.3s;z-index:90;pointer-events:none;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.6);max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <div class="shell">
    <header class="topbar">
      <a class="back" href="index.html">← 心绪</a>
      <div class="brand">沙盘<small>摆一个世界</small></div>
      <div class="top-act">
        <button class="btn" id="openGallery">我的沙盘<span class="n" id="galN"></span></button>
        <button class="btn primary" id="openFinish">完成</button>
      </div>
    </header>

    <main class="stage">
      <div>
        <div class="tray-wrap">
          <div class="tray">
            <div class="tray-inner" id="trayInner">
              <canvas id="sand"></canvas>
              <div class="layer" id="layer"></div>
              <div class="brush" id="brush"></div>
              <div class="hint" id="hint"><p>一盘平整的沙。<br/>从右边挑一件，放进沙里。</p></div>
            </div>
          </div>
        </div>

        <div class="tools-bar">
          <span class="tlabel">手</span>
          <div class="seg" id="modeSeg">
            <button data-mode="dig" aria-pressed="true">⛏ 挖沙</button>
            <button data-mode="pile" aria-pressed="false">⛰ 堆沙</button>
          </div>
          <span class="tlabel" style="margin-left:6px">笔刷</span>
          <div class="seg sizes" id="sizeSeg">
            <button data-r="0.030" aria-pressed="false" aria-label="小"><i style="width:6px;height:6px"></i></button>
            <button data-r="0.055" aria-pressed="true"  aria-label="中"><i style="width:9px;height:9px"></i></button>
            <button data-r="0.090" aria-pressed="false" aria-label="大"><i style="width:13px;height:13px"></i></button>
          </div>
          <span class="spacer"></span>
          <button class="btn" id="flatten">抚平沙面</button>
          <button class="btn" id="clearFigs">收起沙具</button>
        </div>
      </div>

      <aside class="shelf">
        <div class="shelf-head">
          <h2>沙具架</h2>
          <p>拖到沙盘里。放好了再想它是什么。</p>
        </div>
        <div class="cats" id="cats"></div>
        <div class="items" id="items"></div>
      </aside>
    </main>

    <footer>
      <b>这是一个自我陪伴的工具，不是心理治疗。</b><br/>
      如果你正在经历难以承受的时刻，请找一个人说说话。<br/>
      沙盘与日记都只保存在你自己的浏览器里。
    </footer>
  </div>

  <div id="ghost"></div>

  <!-- 完成 -->
  <div class="overlay" id="finishOverlay" role="dialog" aria-modal="true" aria-label="完成">
    <div class="modal">
      <button class="x" data-close="finishOverlay" aria-label="关闭">×</button>
      <h3>这个世界</h3>
      <p class="sub">不用起名字，也不用解释。留个记号就好。</p>

      <div class="fieldlabel"><b>给它一个名字</b>（可留空）</div>
      <input type="text" id="sceneName" placeholder="比如：那天下午" maxlength="24" />

      <div class="fieldlabel"><b>这一刻的心情</b>（可选，会记进心绪的日记）</div>
      <div class="moodrow" id="moodRow"></div>

      <div class="witness" id="witnessBox"><em>留给你自己</em><span id="witnessText"></span></div>

      <button class="go" id="doSave">保存这个世界</button>
      <button class="ghost-btn" id="anotherQ">换一句</button>
    </div>
  </div>

  <!-- 我的沙盘 -->
  <div class="overlay" id="galleryOverlay" role="dialog" aria-modal="true" aria-label="我的沙盘">
    <div class="modal">
      <button class="x" data-close="galleryOverlay" aria-label="关闭">×</button>
      <h3>我的沙盘</h3>
      <p class="sub">按时间倒序。它们之间会有什么变化，你自己看。</p>
      <div id="galBody"></div>
    </div>
  </div>

  <!-- 二次确认。抚平沙面和收起沙具都是不可逆的，原生 confirm 太糙，也不合调性。 -->
  <div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="cfTitle">
    <div class="modal">
      <h3 id="cfTitle"></h3>
      <p class="sub" id="cfSub"></p>
      <button class="go warn" id="cfOk"></button>
      <button class="ghost-btn" id="cfCancel">再想想</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="src/sand.js"></script>
<script src="src/shelf.js"></script>
<script src="src/scene.js"></script>
<script src="src/witness.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var layer = $("#layer"), inner = $("#trayInner"), canvas = $("#sand"),
      brushEl = $("#brush"), ghost = $("#ghost");

  var MOODS = [
    { key:"happy",   label:"开心", e:"☀️", c:"#F2C94C" },
    { key:"calm",    label:"平静", e:"🌤️", c:"#7FB8E6" },
    { key:"anxious", label:"焦虑", e:"🌦️", c:"#E88C5A" },
    { key:"tired",   label:"疲惫", e:"☁️",  c:"#8E8AA6" },
    { key:"sad",     label:"难过", e:"🌧️", c:"#6E8FD9" },
    { key:"angry",   label:"生气", e:"⛈️", c:"#E07A6B" },
  ];
  var ENTRIES_KEY = "xinxu.entries.v1";

  var mode = "dig";                 // dig | pile
  var brushR = 0.055;
  var selId = null;
  var trayRect = null;
  var brushing = false;
  var lastPt = null;                // 上一帧的笔刷位置（用于连续涂抹）
  var drag = null;                  // 拖动中的沙具
  var selMood = null;
  var lastFrame = 0;

  /* ---------- 工具 ---------- */
  function toast(msg) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  /* 本地日期。心绪的日记用的是本地日期，这里必须一致，
     否则晚上写的那条会在时间线上错开一天。 */
  function today() {
    var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function refreshRect() { trayRect = inner.getBoundingClientRect(); }
  function ptToTray(e) {
    if (!trayRect) refreshRect();
    return { x: (e.clientX - trayRect.left) / trayRect.width,
             y: (e.clientY - trayRect.top) / trayRect.height };
  }
  function inTray(p) { return p.x >= 0 && p.x <= 1 && p.y >= 0 && p.y <= 1; }

  /* 记录时刻，显示到分钟。「今天 / 昨天 / …月…日」比一串 YYYY-MM-DD 有体温。 */
  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts), now = new Date();
    var p = function (n) { return String(n).padStart(2, "0"); };
    var hm = p(d.getHours()) + ":" + p(d.getMinutes());
    var midnight = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var days = Math.round((midnight(now) - midnight(d)) / 86400000);
    if (days === 0) return "今天 " + hm;
    if (days === 1) return "昨天 " + hm;
    if (d.getFullYear() === now.getFullYear()) return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + hm;
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  /* 二次确认。返回 Promise，点「再想想」、按 Esc、点背景都算否。 */
  var cfResolve = null;
  function askConfirm(title, sub, okLabel) {
    $("#cfTitle").textContent = title;
    $("#cfSub").textContent = sub;
    $("#cfOk").textContent = okLabel;
    openOverlay("confirmOverlay");
    return new Promise(function (res) { cfResolve = res; });
  }

  /* ---------- 沙面 ---------- */
  Sand.init(canvas);

  /* 一条帧：笔刷 → 沙面推进 → 投影跟随。
     引擎不自己开 rAF，由这里统一驱动。 */
  function loop(ts) {
    requestAnimationFrame(loop);
    var dt = lastFrame ? Math.min((ts - lastFrame) / 16.67, 3) : 1;
    lastFrame = ts;

    if (brushing && lastPt) {
      var s = (mode === "dig" ? -0.0075 : 0.0075) * dt;
      Sand.poke(lastPt.x, lastPt.y, { radius: brushR, strength: s });
    }
    Sand.step();
    syncShadows();
    // 高度场一有变化就（去抖地）落草稿。安息角松弛在笔刷松开之后还会
    // 继续塌一阵，靠 rev 能一直追到它真正稳定为止。
    if (Sand.rev() !== savedRev) persistAll();
  }
  requestAnimationFrame(loop);

  /* 投影跟随沙面高度：沙丘顶小而淡，坑底大而深。
     「沙具真的在沙里」和「贴纸浮在图上」的分界就在这一处。 */
  function shadowOf(it) {
    var k = clamp(Sand.heightAt(it.x, it.y) / 0.8, 0, 1.4);
    return { s: (1.16 - k * 0.34).toFixed(3), o: (0.50 - k * 0.22).toFixed(3) };
  }
  function applyShadow(it) {
    var el = elOf(it.id); if (!el) return;
    var v = shadowOf(it);
    if (el._shs === v.s && el._sho === v.o) return;   // 没变就别碰样式，省重排
    el._shs = v.s; el._sho = v.o;
    el.style.setProperty("--shs", v.s);
    el.style.setProperty("--sho", v.o);
  }
  function syncShadows() {
    var list = Scene.all();
    for (var i = 0; i < list.length; i++) applyShadow(list[i]);
  }

  /* ---------- 沙面指针 ---------- */
  function brushShow(p) {
    brushEl.style.left = (p.x * 100) + "%";
    brushEl.style.top = (p.y * 100) + "%";
    brushEl.style.setProperty("--bd", (brushR * 2 * trayRect.width) + "px");
    brushEl.classList.add("on");
    brushEl.classList.toggle("pile", mode === "pile");
  }
  canvas.addEventListener("pointerdown", function (e) {
    refreshRect();
    var p = ptToTray(e);
    if (!inTray(p)) return;
    select(null);
    brushing = true; lastPt = p;
    canvas.setPointerCapture(e.pointerId);
    brushShow(p);
    hideHint();
  });
  canvas.addEventListener("pointermove", function (e) {
    var p = ptToTray(e);
    if (inTray(p)) brushShow(p);
    if (brushing) lastPt = p;
    else brushEl.classList.remove("on");
  });
  function endBrush() { brushing = false; brushEl.classList.remove("on"); }
  canvas.addEventListener("pointerup", endBrush);
  canvas.addEventListener("pointercancel", endBrush);
  canvas.addEventListener("pointerleave", function () {
    brushEl.classList.remove("on");
  });

  function hideHint() { var h = $("#hint"); if (h) h.classList.add("gone"); }

  /* ---------- 沙具 DOM ---------- */
  function elOf(id) { return layer.querySelector('.fig[data-id="' + id + '"]'); }

  function buildFig(it) {
    var f = Shelf.find(it.k);
    var el = document.createElement("div");
    el.className = "fig";
    el.dataset.id = it.id;
    el.innerHTML =
      '<i class="sh"></i>' +
      '<div class="art">' + f.s + "</div>" +
      '<div class="tools">' +
        '<button data-act="rot"  title="旋转 15°">⟲</button>' +
        '<button data-act="big"  title="放大">＋</button>' +
        '<button data-act="small" title="缩小">－</button>' +
        '<button data-act="del" class="del" title="拿走">✕</button>' +
      "</div>";
    el.querySelector(".art").addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      startDragItem(e, it.id);
    });
    el.querySelector(".tools").addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      var b = e.target.closest("button"); if (!b) return;
      var a = b.dataset.act;
      if (a === "rot")   { Scene.rotateBy(it.id, 15); }
      if (a === "big")   { Scene.scaleBy(it.id, 1.12); }
      if (a === "small") { Scene.scaleBy(it.id, 1 / 1.12); }
      if (a === "del")   { Scene.remove(it.id); el.remove(); select(null); persistAll(); toast("已拿走"); return; }
      place(it); persistAll();
    });
    layer.appendChild(el);
    return el;
  }

  function place(it) {
    var el = elOf(it.id); if (!el) return;
    el.style.left = (it.x * 100) + "%";
    el.style.top = (it.y * 100) + "%";
    el.style.setProperty("--sc", it.sc.toFixed(3));
    el.style.setProperty("--rot", it.rot + "deg");
  }

  function select(id) {
    if (selId === id) return;
    if (selId != null) { var p = elOf(selId); if (p) p.classList.remove("sel"); }
    selId = id;
    if (id != null) {
      var el = elOf(id); if (el) { el.classList.add("sel"); Scene.toFront(id);
        layer.appendChild(el); place(Scene.get(id)); }
    }
  }

  /* ---------- 拖动已有沙具 ---------- */
  function startDragItem(e, id) {
    refreshRect();
    select(id);
    var it = Scene.get(id);
    drag = { id: id, dx: it.x - (e.clientX - trayRect.left) / trayRect.width,
                     dy: it.y - (e.clientY - trayRect.top) / trayRect.height };
    elOf(id).classList.add("dragging");
    var art = e.currentTarget;
    art.setPointerCapture(e.pointerId);
    function mv(ev) {
      if (!drag) return;
      var x = (ev.clientX - trayRect.left) / trayRect.width + drag.dx;
      var y = (ev.clientY - trayRect.top) / trayRect.height + drag.dy;
      Scene.moveTo(drag.id, x, y);
      var cur = Scene.get(drag.id);
      place(cur); applyShadow(cur);      // 拖过沙丘和坑，投影实时跟着变
    }
    function up() {
      art.removeEventListener("pointermove", mv);
      art.removeEventListener("pointerup", up);
      art.removeEventListener("pointercancel", up);
      if (drag) {
        var el = elOf(drag.id); if (el) el.classList.remove("dragging");
        var it2 = Scene.get(drag.id);
        // 拖出沙盘的，等于拿走
        if (it2 && (it2.x < -0.06 || it2.x > 1.06 || it2.y < -0.06 || it2.y > 1.06)) {
          Scene.remove(drag.id); if (el) el.remove(); select(null); toast("已拿走");
        }
      }
      drag = null; persistAll();
    }
    art.addEventListener("pointermove", mv);
    art.addEventListener("pointerup", up);
    art.addEventListener("pointercancel", up);
  }

  /* ---------- 沙具架 ---------- */
  function renderCats() {
    var box = $("#cats");
    Shelf.CATS.forEach(function (c, i) {
      var b = document.createElement("button");
      b.textContent = c.name;
      b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
      b.onclick = function () {
        box.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        renderItems(c);
      };
      box.appendChild(b);
    });
  }
  function renderItems(cat) {
    var box = $("#items");
    box.innerHTML = "";
    cat.items.forEach(function (it) {
      var d = document.createElement("div");
      d.className = "chip";
      d.title = it.n;
      d.innerHTML = it.s + '<span class="cn">' + it.n + "</span>";
      d.addEventListener("pointerdown", function (e) { startShelfDrag(e, it, d); });
      box.appendChild(d);
    });
  }

  function startShelfDrag(e, item, chipEl) {
    e.preventDefault();
    refreshRect();
    var f = Shelf.find(item.k);
    ghost.innerHTML = f.s;
    ghost.style.display = "block";
    ghost.style.left = e.clientX + "px";
    ghost.style.top = e.clientY + "px";

    function mv(ev) {
      ghost.style.left = ev.clientX + "px";
      ghost.style.top = ev.clientY + "px";
      var over = ev.clientX >= trayRect.left && ev.clientX <= trayRect.right &&
                 ev.clientY >= trayRect.top && ev.clientY <= trayRect.bottom;
      ghost.style.opacity = over ? "1" : ".5";
    }
    function up(ev) {
      document.removeEventListener("pointermove", mv);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      ghost.style.display = "none";
      var over = ev.clientX >= trayRect.left && ev.clientX <= trayRect.right &&
                 ev.clientY >= trayRect.top && ev.clientY <= trayRect.bottom;
      if (over) {
        var x = (ev.clientX - trayRect.left) / trayRect.width;
        var y = (ev.clientY - trayRect.top) / trayRect.height;
        var it = Scene.add(item.k, x, y);
        buildFig(it); place(it); applyShadow(it);
        select(it.id);
        hideHint();
        persistAll();
      }
    }
    document.addEventListener("pointermove", mv);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  }

  /* ---------- 工具条 ---------- */
  $("#modeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.mode;
    this.querySelectorAll("button").forEach(function (x) {
      x.setAttribute("aria-pressed", String(x === b));
    });
    inner.classList.toggle("piling", mode === "pile");
  });
  $("#sizeSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    brushR = parseFloat(b.dataset.r);
    this.querySelectorAll("button").forEach(function (x) {
      x.setAttribute("aria-pressed", String(x === b));
    });
  });
  $("#flatten").onclick = function () {
    askConfirm("抚平沙面？",
      "沙面上挖出来的坑和堆起来的丘都会消失，回到一盘平整的沙。沙具不动。这一步收不回来。",
      "抚平").then(function (ok) {
      if (!ok) return;
      Sand.reset(); syncShadows(); persistAll();
      toast("沙面抚平了");
    });
  };
  $("#clearFigs").onclick = function () {
    if (!Scene.count()) return toast("沙盘里还没有沙具");
    askConfirm("收起沙具？",
      "沙盘里的 " + Scene.count() + " 件沙具会全部收走。沙面保持原样。这一步收不回来。",
      "收起来").then(function (ok) {
      if (!ok) return;
      layer.innerHTML = ""; Scene.clear(); selId = null; persistAll();
      toast("已经收起来了");
    });
  };

  document.addEventListener("keydown", function (e) {
    if (selId != null && (e.key === "Delete" || e.key === "Backspace") &&
        !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      var el = elOf(selId); Scene.remove(selId);
      if (el) el.remove();
      selId = null; persistAll(); toast("已拿走");
      e.preventDefault();
    }
    if (e.key === "Escape") {
      // 确认框优先：它开着的时候，Esc 的意思就是「不」
      if ($("#confirmOverlay").classList.contains("open")) return closeConfirm(false);
      if (document.querySelector(".overlay.open")) return closeAll();
      if (selId != null) select(null);
    }
  });
  // 滚轮缩放选中的沙具
  inner.addEventListener("wheel", function (e) {
    if (selId == null) return;
    e.preventDefault();
    Scene.scaleBy(selId, e.deltaY < 0 ? 1.07 : 1 / 1.07);
    place(Scene.get(selId));
    persistAll();
  }, { passive: false });

  /* ---------- 草稿 ---------- */
  var saveTimer = null, savedRev = -1;
  function persistAll() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      Scene.saveDraft(Sand.fieldToB64(Sand.getField()));
      savedRev = Sand.rev();
    }, 420);
  }
  /* 把存档里的沙面放回去。老存档没有这一项，返回 false，沙面保持原样。 */
  function applyField(b64) {
    if (!b64) return false;
    var f = Sand.b64ToField(b64);
    return f ? Sand.setField(f) : false;
  }
  function restore() {
    var d = Scene.loadDraft();
    if (!d) return;
    var field = Scene.load(d);
    applyField(field);
    Scene.all().forEach(function (it) { buildFig(it); place(it); });
    syncShadows();
    if (Scene.count()) hideHint();
  }

  /* ---------- 完成 ---------- */
  function renderMoodRow() {
    var box = $("#moodRow"); box.innerHTML = "";
    MOODS.forEach(function (m) {
      var b = document.createElement("button");
      b.textContent = m.e + " " + m.label;
      b.style.setProperty("--mc", m.c);
      b.setAttribute("aria-pressed", "false");
      b.onclick = function () {
        var on = b.getAttribute("aria-pressed") === "true";
        box.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", on ? "false" : "true");
        selMood = on ? null : m.key;
      };
      box.appendChild(b);
    });
  }

  $("#openFinish").onclick = function () {
    selMood = null;
    $("#sceneName").value = "";
    renderMoodRow();
    $("#witnessText").textContent = Witness.pick();
    openOverlay("finishOverlay");
  };
  $("#anotherQ").onclick = function () { $("#witnessText").textContent = Witness.pick(); };

  $("#doSave").onclick = function () {
    var name = $("#sceneName").value.trim();
    var btn = this;
    btn.disabled = true; btn.textContent = "正在保存…";

    Sand.step();   // 脏矩形还没渲染完就抓图的话，缩略图会停在挖沙之前的状态
    var field = Sand.fieldToB64(Sand.getField());
    Scene.makeThumb(canvas, 400, 300).then(function (thumb) {
      var stored = Scene.saveScene(name, thumb, field);

      // 存不下就说存不下。存档功能最忌讳的就是假装成功。
      if (!stored) {
        btn.disabled = false; btn.textContent = "保存这个世界";
        toast("存不下了——浏览器的存储满了。去「我的沙盘」删掉几件旧的再试。");
        return;
      }

      var wrote = false;
      if (selMood) {
        try {
          var arr = JSON.parse(localStorage.getItem(ENTRIES_KEY) || "[]");
          if (!Array.isArray(arr)) arr = [];
          arr.unshift({
            id: Date.now(),
            date: today(),
            mood: selMood,
            intensity: 3,
            note: "摆了一个沙盘" + (name ? "：《" + name + "》" : ""),
            tags: [],
            from: "sandbox",
            scene: name,
          });
          localStorage.setItem(ENTRIES_KEY, JSON.stringify(arr));
          wrote = true;
        } catch (err) {}
      }

      btn.disabled = false; btn.textContent = "保存这个世界";
      closeAll();
      toast(wrote ? "已保存，也记进日记了" : "已保存");
      refreshGalN();
    });
  };

  /* ---------- 我的沙盘 ---------- */
  function refreshGalN() {
    var n = Scene.listScenes().length;
    $("#galN").textContent = n ? " " + n : "";
  }
  function renderGallery() {
    var list = Scene.listScenes(), box = $("#galBody");
    if (!list.length) {
      box.innerHTML = '<div class="empty">还没有保存过作品。<br/>摆好之后点右上角「完成」。</div>';
      return;
    }
    box.innerHTML = '<div class="gal">' + list.map(function (s) {
      return '<div class="gcard" data-id="' + s.id + '">' +
        (s.thumb ? '<img class="th" src="' + s.thumb + '" alt="" />'
                 : '<div class="th"></div>') +
        '<button class="rm" data-rm="' + s.id + '" title="删除">✕</button>' +
        '<div class="meta"><div class="nm">' + esc(s.name) + "</div>" +
        '<div class="dt">' + (fmtTime(s.ts) || s.date) + " · " +
          (s.data.items || []).length + " 件</div></div></div>";
    }).join("") + "</div>";

    box.querySelectorAll(".gcard").forEach(function (c) {
      c.onclick = function (e) {
        if (e.target.dataset.rm) return;
        var s = Scene.listScenes().filter(function (x) { return x.id === +c.dataset.id; })[0];
        if (!s) return;
        var open = function () {
          clearStage();
          applyField(Scene.load(s.data));
          Scene.all().forEach(function (it) { buildFig(it); place(it); });
          syncShadows(); hideHint(); persistAll(); closeAll();
          toast("打开了「" + s.name + "」");
        };
        if (!Scene.count()) return open();
        askConfirm("打开「" + esc(s.name) + "」？",
          "现在沙盘里的东西会被替换掉。没存过的话，它就没了。",
          "打开").then(function (ok) { if (ok) open(); });
      };
    });
    box.querySelectorAll("[data-rm]").forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        var s = Scene.listScenes().filter(function (x) { return x.id === +b.dataset.rm; })[0];
        askConfirm("删掉这件作品？",
          "「" + esc(s.name || "未命名") + "」会从我的沙盘里消失。这一步收不回来。",
          "删掉").then(function (ok) {
          if (!ok) return;
          Scene.deleteScene(+b.dataset.rm);
          renderGallery(); refreshGalN();
        });
      };
    });
  }
  function clearStage() {
    layer.innerHTML = ""; Scene.clear(); selId = null;
  }
  $("#openGallery").onclick = function () { renderGallery(); openOverlay("galleryOverlay"); };

  /* ---------- 弹层 ---------- */
  function openOverlay(id) { $("#" + id).classList.add("open"); }

  /* 确认框只关自己。它常常是盖在别的弹层上问的（比如从「我的沙盘」里删作品），
     把底下的画廊一起关掉会让人莫名其妙。 */
  function closeConfirm(result) {
    $("#confirmOverlay").classList.remove("open");
    var r = cfResolve; cfResolve = null;
    if (r) r(result);
  }
  /* 关闭一切。悬着的确认框一律按「否」结清——
     点背景、按 Esc 或别的什么把弹层关掉，都不该被当成同意。 */
  function closeAll() {
    document.querySelectorAll(".overlay").forEach(function (o) { o.classList.remove("open"); });
    if (cfResolve) { var r = cfResolve; cfResolve = null; r(false); }
  }
  $("#cfOk").onclick = function () { closeConfirm(true); };
  $("#cfCancel").onclick = function () { closeConfirm(false); };
  document.querySelectorAll("[data-close]").forEach(function (b) {
    b.onclick = function () {
      if (b.dataset.close === "confirmOverlay") return closeConfirm(false);
      $("#" + b.dataset.close).classList.remove("open");
    };
  });
  document.querySelectorAll(".overlay").forEach(function (o) {
    o.addEventListener("click", function (e) {
      if (e.target !== o) return;                        // 只认点背景，不认点内容
      if (o.id === "confirmOverlay") return closeConfirm(false);
      o.classList.remove("open");
    });
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- 启动 ---------- */
  window.addEventListener("resize", function () { refreshRect(); });
  window.addEventListener("scroll", function () { refreshRect(); }, { passive: true });

  renderCats();
  renderItems(Shelf.CATS[0]);
  inner.style.setProperty("--figw", (Scene.FIG_W * 100) + "%");
  restore();
  syncShadows();
  refreshGalN();
  refreshRect();

})();
</script>
</body>
</html>
