<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#221D36" />
<title>对话 · 心绪</title>
<meta name="description" content="说说现在，选择希望被怎样回应。" />
<style>html.xo-pending .shell{visibility:hidden}</style>
<script>
  try{
    if(sessionStorage.getItem("xinxu.unlocked.v1") !== "1") location.replace("index.html");
    if(!(localStorage.getItem("xinxu.account.v1") && localStorage.getItem("xinxu.consent.v1") && sessionStorage.getItem("xinxu.unlocked.v1") === "1"))
      document.documentElement.className += " xo-pending";
  }catch(e){ document.documentElement.className += " xo-pending"; }
</script>
<style>
  :root{
    --ink:#221D36; --ink2:#2A2440; --ink3:#332C4E; --line:#3B3358;
    --paper:#F1ECE1; --muted:#9C94B4; --faint:#6E6786;
    --lamp:#F0B36A; --lilac:#A78BFA; --warn:#E88C5A; --bad:#E07A6B;

    --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
    --sans:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    --r-lg:22px; --r-md:16px; --r-sm:11px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--ink);color:var(--paper);
    line-height:1.7;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .sky{position:fixed;inset:0;z-index:-2;
    background:radial-gradient(120% 80% at 50% -10%, #34294f 0%, var(--ink) 55%)}
  .blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(80px);opacity:.24;pointer-events:none}
  .blob.a{width:52vw;height:52vw;left:-16vw;top:-6vw;background:var(--lilac)}
  .blob.b{width:46vw;height:46vw;right:-14vw;top:14vh;background:var(--lamp)}

  .shell{max-width:760px;margin:0 auto;padding:0 18px 70px}

  .topbar{display:flex;align-items:center;gap:14px;padding:20px 0 14px;border-bottom:1px solid var(--line)}
  .back{color:var(--muted);text-decoration:none;font-size:.82rem;white-space:nowrap;
    padding:6px 12px;border:1px solid var(--line);border-radius:99px;transition:.15s}
  .back:hover{color:var(--lamp);border-color:var(--lamp)}
  .brand{font-family:var(--serif);font-weight:700;font-size:1.2rem;letter-spacing:1px;line-height:1.2}
  .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:.68rem;
    color:var(--faint);letter-spacing:1px}
  .top-act{margin-left:auto;display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:transparent;color:var(--paper);
    padding:8px 15px;border-radius:99px;font-size:.82rem;cursor:pointer;
    font-family:var(--sans);transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--lamp);color:var(--lamp)}
  .btn.primary{background:linear-gradient(120deg,var(--lamp),#e89a4f);color:#2a1a05;
    border-color:transparent;font-weight:600}
  .btn.primary:hover{filter:brightness(1.06);color:#2a1a05}
  .btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{
    outline:2px solid var(--lamp);outline-offset:2px}
  .btn[disabled]{opacity:.45;cursor:default}

  .stage{margin-top:20px}

  .card{background:var(--ink2);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:18px 18px 20px;margin-bottom:16px}
  .card h2{font-family:var(--serif);font-size:1rem;font-weight:700;letter-spacing:1px}
  .card .sub{font-size:.76rem;color:var(--faint);margin-top:3px;line-height:1.6}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}

  /* ---------- 对话 ---------- */
  .chat{display:flex;flex-direction:column;min-height:440px}
  .chat-log{flex:1;overflow-y:auto;max-height:52vh;display:flex;flex-direction:column;gap:14px;padding-right:4px}
  .turn{display:flex;gap:10px}
  .turn .who{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:.7rem;background:var(--ink3);color:var(--muted);margin-top:3px}
  .turn.me .who{background:color-mix(in srgb,var(--lamp) 26%,var(--ink3));color:var(--lamp)}
  .turn .body{flex:1;min-width:0}
  .turn .body p{white-space:pre-wrap;font-size:.92rem;line-height:1.8}
  .turn.me .body p{color:var(--paper)}
  .turn.ai .body p{color:color-mix(in srgb,var(--paper) 92%,var(--lilac))}
  .turn .meta{font-size:.68rem;color:var(--faint);margin-top:6px}

  .chat-in{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .chat-in textarea{width:100%;background:var(--ink3);border:1px solid var(--line);
    border-radius:var(--r-md);color:var(--paper);font-family:var(--sans);font-size:.94rem;
    padding:12px 14px;resize:vertical;min-height:76px;line-height:1.7}
  .chat-in textarea::placeholder{color:var(--faint)}
  .chat-in .row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .chat-in .row .grow{flex:1}

  .empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:.88rem;
    border:1px dashed var(--line);border-radius:var(--r-md)}
  .goal-row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .goal-row button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--ink);font-weight:700}
  .notice{font-size:.78rem;color:var(--muted);line-height:1.7}
  .notice a{color:var(--lamp)}
  .notice label{display:flex;align-items:flex-start;gap:8px;margin-top:10px;color:var(--paper)}
  .notice input[type="checkbox"]{margin-top:5px;accent-color:var(--lamp)}
  .notice details{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .notice summary{cursor:pointer;color:var(--lamp)}
  .action-item{padding:9px 0;border-top:1px solid var(--line);font-size:.84rem}
  .action-item button{margin-top:6px;margin-right:6px}
  .action-item input{width:100%;background:var(--ink3);border:1px solid var(--line);border-radius:8px;color:var(--paper);padding:8px}

  /* ---------- 提议条 ---------- */
  .propose{margin-top:12px;border-radius:var(--r-md);padding:13px 15px;
    background:color-mix(in srgb,var(--lilac) 10%,var(--ink3));
    border:1px solid color-mix(in srgb,var(--lilac) 32%,var(--line))}
  .propose h4{font-size:.8rem;font-weight:600;color:var(--lilac);margin-bottom:9px;letter-spacing:.5px}
  .pitem{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:.86rem}
  .pitem + .pitem{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
  .pitem .k{flex:0 0 auto;font-size:.64rem;color:var(--muted);border:1px solid var(--line);
    padding:1px 7px;border-radius:99px;margin-top:3px}
  .pitem .t{flex:1;min-width:0}
  .prow{display:flex;gap:8px;margin-top:11px}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--paper);color:var(--ink);padding:10px 20px;border-radius:99px;font-size:.85rem;
    opacity:0;transition:.3s;z-index:90;pointer-events:none;max-width:88vw;text-align:center;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.6)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{margin-top:40px;text-align:center;color:var(--faint);font-size:.72rem;line-height:1.9}
  footer b{color:var(--muted);font-weight:500}
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="blob a"></div>
  <div class="blob b"></div>

  <div class="shell">
    <header class="topbar">
      <a class="back" href="index.html">← 返回主页</a>
      <div class="brand">聊一聊<small>这是专门的交流空间</small></div>
      <div class="top-act"></div>
    </header>

    <main class="stage">
      <section>
        <div class="card">
          <h2>这次希望怎么聊？</h2>
          <div class="goal-row" id="goalRow" aria-label="本次对话目标">
            <button class="btn" data-goal="be_heard" aria-pressed="true">听我说</button>
            <button class="btn" data-goal="understand" aria-pressed="false">理清原因</button>
            <button class="btn" data-goal="calm" aria-pressed="false">先缓一缓</button>
            <button class="btn" data-goal="next_step" aria-pressed="false">找下一步</button>
          </div>
          <p class="sub">随时可以切换。建议会按这次目标调整，也可以跳过。</p>
        </div>
        <div class="card notice" id="aiNotice">
          <h2>AI 数据告知</h2>
          <p id="providerInfo">正在读取服务配置…</p>
          <p>发送时会提交本次消息、最多六条本页对话、目标和策略给已配置的模型服务。模型可能处理敏感的情绪内容。请避免输入不想交给模型的信息。</p>
          <details><summary>选择额外提供的信息</summary>
            <label><input type="checkbox" id="includeEntries">最近情绪记录摘要（坐标与标签，无日记原文）</label>
            <label><input type="checkbox" id="includeMemory">你已确认的长期记忆</label>
            <label><input type="checkbox" id="includeDevices">使用主页的设备线索（当前为演示数据）</label>
          </details>
          <label><input type="checkbox" id="aiConsent">我已阅读本次数据告知，同意发送所选内容</label>
          <button class="btn" id="revokeConsent" type="button">撤销授权</button>
        </div>
        <div class="card chat">
          <div class="chat-log" id="chatLog"></div>
          <div id="proposeBox"></div>
          <div id="actionBox"></div>
          <div class="chat-in">
            <textarea id="say" placeholder="现在想说点什么？不用组织语言。"></textarea>
            <div class="row">
              <span class="grow" style="font-size:.72rem;color:var(--faint)">
                Ctrl/⌘ + Enter 发送。行动建议由你决定是否采用。
              </span>
              <button class="btn primary" id="send">说</button>
            </div>
          </div>
        </div>
      </section>

    </main>

    <footer>
      <b>这不是治疗，也不做诊断。</b><br/>
      当前页面对话关闭即消失；发送时会传给已配置的模型服务，保留规则见上方告知。<br/>
      模型给的建议需要你确认才会写入记录。
    </footer>
  </div>

  <div class="toast" id="toast"></div>

<!-- 顺序有依赖：onboarding 要用 vault，support 要用 onboarding 的须知渲染 -->
<script src="src/safety-content.js"></script>
<script src="src/vault.js"></script>
<script src="src/mood.js"></script>
<script src="src/memory.js"></script>
<script src="src/wearables.js"></script>
<script src="src/agent.js"></script>
<script src="src/onboarding.js"></script>
<script src="src/safety.js"></script>
<script src="src/support.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var Mem = window.XinxuMemory, Ag = window.XinxuAgent;

  function toast(m) {
    var t = $("#toast"); t.textContent = m; t.classList.add("show");
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ================= 对话 ================= */
  var turns = [];
  var goal = "be_heard", providerInfo = null;
  try { goal = sessionStorage.getItem("xinxu.ai.goal.v1") || goal; } catch (e) {}
  var phaseFor = { be_heard: "soothe", understand: "explore", calm: "soothe", next_step: "act" };
  if (!Object.prototype.hasOwnProperty.call(phaseFor, goal)) goal = "be_heard";
  var consentKey = "xinxu.ai.consent.v2";
  function consentSignature(info) {
    return [info.noticeVersion, info.providerName, info.privacyUrl, info.retention].join("|");
  }
  function loadProviderInfo() {
    fetch("/assist/info").then(function (r) { if (!r.ok) throw new Error("服务不可用"); return r.json(); })
      .then(function (info) {
        providerInfo = info;
        var p = $("#providerInfo");
        if (!info.ready) { p.textContent = "模型或供应商数据告知尚未配置，暂不能发送。"; return; }
        p.innerHTML = "模型服务：" + esc(info.providerName) + "。数据保留：" + esc(info.retention) +
          '。<a href="' + esc(info.privacyUrl) + '" target="_blank" rel="noopener noreferrer">查看供应商隐私说明</a>。';
        try { $("#aiConsent").checked = localStorage.getItem(consentKey) === consentSignature(info); } catch (e) {}
      }).catch(function () { $("#providerInfo").textContent = "无法读取模型服务配置。请从同源服务打开此页面。"; });
  }
  $("#goalRow").querySelectorAll("[data-goal]").forEach(function (b) {
    b.onclick = function () {
      goal = b.dataset.goal;
      try { sessionStorage.setItem("xinxu.ai.goal.v1", goal); sessionStorage.removeItem("xinxu.ai.strategy.v1"); } catch (e) {}
      $("#goalRow").querySelectorAll("[data-goal]").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
    };
  });
  $("#goalRow").querySelectorAll("[data-goal]").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.goal === goal ? "true" : "false");
  });
  $("#revokeConsent").onclick = function () {
    $("#aiConsent").checked = false;
    try { localStorage.removeItem(consentKey); } catch (e) {}
    toast("已撤销 AI 授权");
  };

  function renderChat() {
    var box = $("#chatLog");
    if (!turns.length) {
      box.innerHTML = '<div class="empty">还没有开始。<br/>' +
        '可以从「这两天有点说不上来的累」开始，也可以只是说说今天发生了什么。</div>';
      return;
    }
    box.innerHTML = turns.map(function (t) {
      return '<div class="turn ' + (t.me ? "me" : "ai") + '">' +
        '<span class="who">' + (t.me ? "我" : "心") + "</span>" +
        '<div class="body"><p>' + esc(t.text) + "</p>" +
        (t.meta ? '<div class="meta">' + esc(t.meta) + "</div>" : "") +
        "</div></div>";
    }).join("");
    box.scrollTop = box.scrollHeight;
  }

  function renderPropose(res) {
    var box = $("#proposeBox");
    var hasMem = res.suggest.memory && res.suggest.memory.length;
    var hasEntry = !!res.suggest.entry;
    if (!hasMem && !hasEntry) { box.innerHTML = ""; return; }

    var html = '<div class="propose"><h4>要记下来吗</h4>';
    if (hasMem) {
      res.suggest.memory.forEach(function (m) {
        html += '<div class="pitem"><span class="k">' + esc(Mem.kindByKey(m.kind).name) + '</span>' +
                '<span class="t">' + esc(m.text) + "</span></div>";
      });
    }
    if (hasEntry) {
      var e = res.suggest.entry;
      var near = window.XinxuMood.nearest(e.v, e.a);
      html += '<div class="pitem"><span class="k">心情</span><span class="t">' +
        window.XinxuMood.icon(near.key, 20) + " " + esc(near.label) + " · " + window.XinxuMood.strengthLabel(e.v, e.a) +
        (e.note ? "　" + esc(e.note) : "") + "</span></div>";
    }
    html += '<div class="prow">' +
      '<button class="btn primary" id="pYes">记住' + (hasEntry && !hasMem ? "并记一条" : "") + "</button>" +
      '<button class="btn" id="pNo">不用</button></div></div>';
    box.innerHTML = html;

    $("#pYes").onclick = function () {
      var n = 0;
      if (hasMem) n += Mem.resolve(true);
      if (hasEntry) {
        var e = res.suggest.entry;
        if (window.XinxuMood) {
          XinxuMood.appendEntry({
            id: Date.now(), ts: Date.now(), date: XinxuMood.todayStr(),
            v: e.v, a: e.a, note: e.note || "", tags: e.tags || [],
            from: "agent",
          });
          n++;
        }
      }
      // 已经从待确认转成已确认，清掉待确认列表里对应的项
      Mem.dropPending();
      renderPropose({ suggest: { memory: [], entry: null } });
      toast("已记下 " + n + " 项");
    };
    $("#pNo").onclick = function () {
      Mem.dropPending();
      renderPropose({ suggest: { memory: [], entry: null } });
    };
  }

  function renderActions(res) {
    var box = $("#actionBox");
    var actions = Array.isArray(res.actions) ? res.actions : [];
    if (!actions.length || (res.safety && res.safety.level === "urgent")) { box.innerHTML = ""; return; }
    box.innerHTML = '<div class="propose"><h4>可以考虑的下一步 · 可改可跳过</h4>' +
      actions.map(function (a, i) {
        return '<div class="action-item"><b>' + esc(a.title) + '</b><p>' + esc(a.description) + '</p>' +
          '<button class="btn" data-action="' + i + '">采用</button><button class="btn" data-skip="' + i + '">跳过</button></div>';
      }).join("") + '</div>';
    box.querySelectorAll("[data-action]").forEach(function (b) {
      b.onclick = function () {
        var item = b.closest(".action-item"), p = item.querySelector("p");
        var input = document.createElement("input"); input.value = p.textContent; input.maxLength = 300;
        p.replaceWith(input); b.textContent = "保存本次决定";
        b.onclick = function () { item.textContent = "已采用：" + input.value.trim(); };
      };
    });
    box.querySelectorAll("[data-skip]").forEach(function (b) { b.onclick = function () { b.closest(".action-item").remove(); }; });
  }

  var busy = false;
  function send() {
    if (busy) return;
    var txt = $("#say").value.trim();
    if (!txt) { toast("先说点什么"); return; }
    if (!providerInfo || !providerInfo.ready) { toast("模型服务尚未配置"); return; }
    if (!$("#aiConsent").checked) { toast("请先阅读并同意 AI 数据告知"); return; }
    try { localStorage.setItem(consentKey, consentSignature(providerInfo)); } catch (e) {}
    var history = turns.slice(-6).filter(function (t) { return t.text !== "…"; }).map(function (t) {
      return { role: t.me ? "user" : "assistant", content: t.text.slice(0, 1000) };
    });

    busy = true;
    $("#send").disabled = true;
    $("#say").value = "";
    turns.push({ me: true, text: txt });
    turns.push({ me: false, text: "…" });
    renderChat();

    var sentGoal = goal;
    Ag.run({ task: "chat", input: txt, goal: sentGoal, stage: phaseFor[sentGoal], style: "warm",
      consent: true, history: history,
      use: { entries: $("#includeEntries").checked, sandbox: false,
        devices: $("#includeDevices").checked, memory: $("#includeMemory").checked } })
      .then(function (res) {
        turns.pop();
        turns.push({
          me: false,
          text: res.reply,
          meta: res.generatedBy === "safety-rule" ? "安全提示" : ((res.strategy || "AI 回复") + " · " + res.meta.ms + "ms"),
        });
        renderChat();
        if (res.generatedBy === "model" && res.strategy) {
          try { sessionStorage.setItem("xinxu.ai.strategy.v1", JSON.stringify({ goal: sentGoal, strategy: res.strategy })); } catch (e) {}
        }
        renderPropose(res);
        renderActions(res);

        // 安全检查命中就走求助入口。
        // 这里不接「一天只提醒一次」——对话里跨轮浮现的信号不能被日限静默掉。
        if (res.safety && res.safety.level !== "none" && window.XinxuSafety) {
          XinxuSafety.show(res.safety);
        }
        if (res.blocked) toast("模型那句话越界了，已拦下");
      })
      .catch(function (err) {
        turns.pop();
        turns.push({ me: false, text: "这次没发出去：" + (err && err.message ? err.message : "未知错误") +
          "\n\n请稍后重试，或检查服务是否已配置。" });
        renderChat();
      })
      .then(function () {
        busy = false;
        $("#send").disabled = false;
        $("#say").focus();
      });
  }

  $("#send").onclick = send;
  $("#say").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });

  /* ================= 启动 ================= */
  renderChat(); loadProviderInfo();
  if (!window.XinxuWearables || !XinxuWearables.days(1).length) {
    $("#includeDevices").disabled = true;
    $("#includeDevices").parentNode.lastChild.textContent = "主页暂无设备线索；可先在主页查看示例";
  }

  // 会话不留原文：只留最近几条用于界面回看，关掉页面就没了。
})();
</script>
</body>
</html>
